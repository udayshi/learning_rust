[package]
name = "rust_practise"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
rusqlite = { version = "0.41", features = ["bundled"] }

serde_json = "1.0.154"
aes-gcm = { version = "0.11", features = ["getrandom"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.10"

serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1.54.1", features = ["full"] }


[lints.rust]
dead_code = "allow"
